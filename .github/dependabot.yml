version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels: [dependencies, python]
    ignore:
      # Bittensor v11 changes runtime contracts used by Axon/Dendrite. Upgrade
      # only through a deliberate compatibility release, never an automated PR.
      - dependency-name: bittensor
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions]
