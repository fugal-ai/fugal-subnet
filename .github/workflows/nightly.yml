name: Nightly

# The dress rehearsal runs the SHIPPED binaries against a real subtensor node:
# real wallets, real registration, real axon and dendrite over the wire, real
# set_weights. It is the only check that exercises chain integration, and it has
# found defects that in-process tests are structurally blind to — an epoch id
# formatted two different ways, weights reported set against a chain that stored
# nothing, a miner deadlocked on its own stdout.
#
# It is nightly rather than per-PR because it needs a chain container and takes
# minutes, and it exists at all because the lesson this repository keeps
# relearning is that an unexercised path is a broken path that does not know it.
# Leaving the thing that proved that unexercised would be a poor joke.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dress-rehearsal:
    name: Dress rehearsal against a real chain (${{ matrix.ref }}, ${{ matrix.scenario }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # A schedule only fires on the default branch, so the release branch
        # is checked out explicitly: protocol v2 lives there until the flip,
        # and the v2_flip scenario (the activation boundary, the first seat, a
        # take, a ghost, a resume) is the only chain-level exercise of it.
        include:
          - { ref: main, scenario: all }
          - { ref: release/v2, scenario: all }
          - { ref: release/v2, scenario: v2_flip }
    env:
      PYTHONUTF8: "1"
      FUGAL_SKIP_BENCHMARKS: mmlu,math,gsm8k,humaneval,livecode,gpqa,ifeval,aime

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: The scenario against a real subtensor node
        # "all" includes E, which runs the SHIPPED binaries with the real
        # backbone — the scenario that found the axon, commitment and
        # weight-setting defects. Dropping it to save a model download would
        # remove the part that exercises the code an operator actually runs.
        run: uv run python scripts/dress_rehearsal.py --scenario ${{ matrix.scenario }}

      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dress-rehearsal-report-${{ strategy.job-index }}-${{ matrix.scenario }}
          path: results/
          if-no-files-found: ignore
