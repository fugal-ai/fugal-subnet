name: Feature request
description: Propose a scoped improvement to Fugal Subnet
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete user, miner, or validator problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior and its tradeoffs.
    validations:
      required: true
  - type: dropdown
    id: consensus
    attributes:
      label: Could this change consensus behavior?
      options:
        - "No"
        - "Yes"
        - "Unsure"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
