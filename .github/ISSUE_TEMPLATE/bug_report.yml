name: Bug report
description: Report a reproducible problem in Fugal Subnet
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Fugal. Never include API keys, wallet secrets, mnemonics, or other credentials.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Validator
        - Miner
        - Grader or benchmark
        - Head training or evaluation
        - Local testnet or Docker
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit SHA.
      placeholder: v0.1.0 or 24a0cd2
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Bittensor SDK version, network, and relevant hardware.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest sequence that reproduces the problem. Use mock mode when possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove all credentials, wallet material, and sensitive endpoint data.
      render: shell
