[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fugal-subnet"
version = "0.1.0"
description = "Bittensor subnet for continuous LLM router optimization"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.13"
keywords = ["bittensor", "decentralized-ai", "llm-routing", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "bittensor==10.5.0",
    "pydantic==2.13.5",
    "torch==2.14.0",
    "transformers==5.16.1",
    "numpy==2.2.6",
    "httpx==0.28.1",
    "click==8.5.0",
    "datasets==5.0.1",
    "cmaes==0.13.1",
    "math-verify==0.9.0",
]

[project.urls]
Repository = "https://github.com/fugal-ai/fugal-subnet"
Documentation = "https://github.com/fugal-ai/fugal-subnet/tree/main/docs"
Issues = "https://github.com/fugal-ai/fugal-subnet/issues"
Changelog = "https://github.com/fugal-ai/fugal-subnet/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.11.0",
    "pip-audit>=2.7.0",
]

[project.scripts]
fugal-validator = "neurons.validator:main"
fugal-miner = "neurons.miner:main"

[tool.setuptools.packages.find]
include = ["fugal_subnet*", "neurons*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E402",   # module-import-not-at-top (intentional in backbone.py, validator.py)
    "E501",   # line-too-long (existing code)
    "E701",   # multiple-statements-on-one-line
    "E702",   # multiple-statements-on-one-line-semicolon
    "E741",   # ambiguous-variable-name (W, b, etc. are standard ML names)
    "F841",   # local-variable-is-assigned-but-never-used (side-effect calls)
]

[tool.ruff.lint.per-file-ignores]
"fugal_subnet/graders.py" = ["ALL"]  # immutable hash-pinned file
