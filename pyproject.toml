[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fugal-subnet"
version = "0.1.0"
description = "Bittensor subnet for continuous LLM router optimization"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "bittensor>=10.0.0,<11.0.0",
    "pydantic>=2.0.0",
    "torch>=2.0.0",
    "transformers>=4.51.0",
    "numpy>=1.24.0",
    "httpx>=0.27.0",
    "click>=8.1.0",
    "datasets>=2.18.0",
    "cmaes>=0.10.0",
    "math-verify>=0.7.0",
]

[project.urls]
Repository = "https://github.com/fugal-ai/fugal-subnet"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
fugal-validator = "neurons.validator:main"
fugal-miner = "neurons.miner:main"

[tool.setuptools.packages.find]
include = ["fugal_subnet*", "neurons*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
